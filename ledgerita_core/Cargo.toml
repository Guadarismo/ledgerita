[package]
name = "ledgerita_core"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2.2.0" }
libp2p = { version = "0.56.0", features = ["tcp", "tokio", "noise", "yamux", "ping", "macros", "request-response"] }
sha2 = "0.10.9"
getrandom = "0.2"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
orion = "0.17"
sled = "0.34"
thiserror = "1"
zeroize = { version = "1.8", features = ["derive", "alloc"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
