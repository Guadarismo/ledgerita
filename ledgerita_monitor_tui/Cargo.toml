[package]
name = "ledgerita_monitor_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
futures = "0.3"
ledgerita_core = { version = "0.1.0", path = "../ledgerita_core" }
libp2p = { version = "0.56.0", features = ["tcp", "tokio", "noise", "yamux", "ping", "macros", "request-response"] }
ratatui = "0.30.2"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
ed25519-dalek = "2.2.0"
