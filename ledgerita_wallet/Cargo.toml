[package]
name = "ledgerita_wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "2.2.0"
eframe = "0.35.0"
futures = "0.3"
getrandom = "0.2"
ledgerita_core = { version = "0.1.0", path = "../ledgerita_core" }
libp2p = { version = "0.56.0", features = ["tcp", "tokio", "noise", "yamux", "ping", "macros", "request-response"] }
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
